<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Acme Commercial Analytics</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
           background:#f4f5f7; margin:0; padding:32px; color:#1f2330; }
    h1   { font-size:22px; margin:0 0 4px; }
    .sub { color:#5a6072; font-size:14px; margin-bottom:28px; }
    .row { display:flex; gap:24px; flex-wrap:wrap; }
    .card{ background:#fff; border:1px solid #e2e4ea; border-radius:10px;
           padding:20px; flex:1; min-width:420px; }
    .card h2 { font-size:16px; margin:0 0 14px; }
    iframe   { border:0; width:100%; height:130px; }
  </style>
</head>
<body>
  <h1>Acme Commercial Analytics</h1>
  <div class="sub">Dashboard portal &middot; data health provided by dbt</div>

  <div class="row">
    <div class="card">
      <h2>Field Force Weekly Scorecard</h2>
      <!-- PASTE the iFrame from Catalog > Exposures > field_force_weekly_scorecard -->
      <iframe src="PASTE_HEALTHY_TILE_URL_HERE" title="Field Force data health"></iframe>
    </div>

    <div class="card">
      <h2>Executive Brand Review</h2>
      <!-- PASTE the iFrame from Catalog > Exposures > executive_brand_review -->
      <iframe src="PASTE_DEGRADED_TILE_URL_HERE" title="Executive Brand Review data health"></iframe>
    </div>
  </div>
</body>
</html>
