version: 2

models:

  # -----------------------------------------------------------------
  # DEMO: the HCP dimension is deliberately undocumented. This is the
  # model to run dbt Wizard against on the call. Note that tier is
  # exactly the column an AI cannot get right on its own.
  # -----------------------------------------------------------------
  - name: stg_veeva__hcp
    columns:
      - name: hcp_id
        tests: [unique, not_null]
      - name: tier
      - name: is_targeted

  - name: stg_veeva__rep
    description: One row per sales rep. Reps are aligned one-to-one with territories.
    columns:
      - name: rep_id
        description: Unique rep identifier.
        tests: [unique, not_null]
      - name: territory_id
        description: Territory the rep owns.
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_internal__geography')
              field: territory_id

  - name: stg_internal__geography
    description: >
      Territory alignment hierarchy. Territory rolls to area, area to region,
      region to nation. Reset at the start of each plan year.
    columns:
      - name: territory_id
        description: Unique territory identifier.
        tests: [unique, not_null]
      - name: territory_name
        description: Human-readable territory name, state plus sequence number.
      - name: area_name
        description: Area rollup. Aligned to state.
      - name: region_name
        description: Region rollup.
        tests:
          - accepted_values:
              values: ['Northeast', 'Midwest', 'South', 'Northwest']
      - name: population
        description: Population covered by the territory. Used to normalise territory size.

  - name: stg_internal__calendar
    description: Weekly calendar spine with sales cycle and available selling days.
    columns:
      - name: calendar_week
        description: Week-starting date.
        tests: [unique, not_null]
      - name: cycle_id
        description: Sales cycle the week belongs to, formatted YYYY-Qn.
        tests: [not_null]
      - name: selling_days
        description: Selling days available in the week. Used to normalise call rates.
