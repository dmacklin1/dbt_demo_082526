version: 2

sources:
  - name: iqvia
    description: >
      IQVIA Exponent. Syndicated market share data covering the brand and its
      three named competitors. Delivered monthly with a publication lag, and
      currently well behind schedule.
    database: DBT_DEMO_BRZ
    schema: SOURCE_A
    loaded_at_field: INSERT_TIME
    tables:

      - name: f_market_share
        identifier: F_MARKET_SHARE
        description: >
          Monthly TRx volume and share by drug and indication. Grain is
          month-end date x drug x indication.
        freshness:
          warn_after: {count: 35, period: day}
          error_after: {count: 45, period: day}
        columns:
          - name: DATE
            description: Month-end date the share figures apply to.
          - name: COMPANY_DRUG_NAME
            description: "TargetBrand or one of Competitor_A, Competitor_B, Competitor_C."
          - name: TRX_VOLUME
            description: Total prescriptions for that drug and indication in the month.
          - name: TRX_SHARE
            description: Share of total market TRx for that indication. Sums to 1.0 per month per indication.
          - name: INDICATION
            description: "Derm or Rheum."
          - name: INSERT_TIME
            description: Timestamp the row landed in bronze. Drives source freshness.
