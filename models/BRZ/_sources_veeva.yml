version: 2

sources:
  - name: veeva
    description: >
      Veeva CRM. System of record for field force activity and for HCP and rep
      master data. Delivered as a nightly sync into the bronze landing zone.
    database: DBT_DEMO_BRZ
    schema: SOURCE_A
    tables:

      - name: f_calls
        identifier: F_CALLS
        description: >
          One row per PLANNED call. CALL_ID is populated only when the call was
          actually completed, so a null CALL_ID is a planned call that did not
          happen. This is the grain reach and frequency are built from.
        columns:
          - name: CALL_ID
            description: >
              Identifier for a COMPLETED call. Null when the call was planned but
              never executed. This nullability is intentional and is how call
              plan attainment is calculated.
          - name: DATE
            description: Week-starting date the call was planned for.
          - name: HCP_ID
            description: Health care professional the call was directed at.
          - name: REP_ID
            description: Sales representative who owned the call.
          - name: INDICATION
            description: "Therapeutic area detailed against: Derm or Rheum."
          - name: CALL_TYPE
            description: "In-Person or Virtual."
          - name: CALL_PLAN_GOAL
            description: Always 1. One row equals one planned call.
          - name: TERRITORY_ID
            description: Territory the call rolls up to.
          - name: INSERT_TIME
            description: Timestamp the row landed in bronze. Drives source freshness.

      # -----------------------------------------------------------------
      # DEMO GAP: freshness deliberately NOT configured on the HCP master.
      # Uncomment live on the call to close a monitoring blind spot in 30s.
      # -----------------------------------------------------------------
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
      - name: d_hcp
        identifier: D_HCP
        description: HCP master. One row per health care professional.
        # freshness:
        #   warn_after: {count: 7, period: day}
        #   error_after: {count: 14, period: day}
        columns:
          - name: HCP_ID
          - name: TIER
          - name: INSERT_TIME

      - name: d_rep
        identifier: D_REP
        description: Sales rep master. One row per rep, aligned to one territory.
        columns:
          - name: REP_ID
            description: Unique rep identifier.
          - name: TERRITORY_ID
            description: Territory the rep is aligned to. One rep per territory.
          - name: INSERT_TIME
            description: Timestamp the row landed in bronze. Drives source freshness.
        config:
          freshness:
            warn_after: {count: 14, period: day}
            error_after: {count: 30, period: day}
    config:
      loaded_at_field: INSERT_TIME