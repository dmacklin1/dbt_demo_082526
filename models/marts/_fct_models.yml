version: 2

models:

  - name: fct_call_activity
    description: >
      Field force execution by territory and week: call plan attainment, reach,
      and frequency.

      Every upstream source of this model refreshes daily, so this fact stays
      current even when the finance and syndicated feeds are behind.
    columns:
      - name: call_week
        tests: [not_null]
      - name: territory_id
        tests: [not_null]
      - name: territory_name
        description: Human-readable territory name.
      - name: region_name
        description: Region the territory rolls up to.
      - name: cycle_id
        description: Sales cycle the week belongs to.
      - name: calls_planned
        description: Calls on the plan for the week.
      - name: calls_completed
        description: Calls actually executed.
      - name: call_plan_attainment
        description: >
          Completed calls divided by planned calls. The primary field force
          execution metric. Target is 0.80.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: reach_pct
        description: >
          Share of the target HCP list that received at least one completed call
          in the week. Distinct HCPs reached over distinct HCPs targeted.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: frequency
        description: >
          Average number of completed calls per HCP reached. Reach and frequency
          together describe coverage: high reach with low frequency means broad
          but shallow coverage.
      - name: calls_per_selling_day
        description: Completed calls normalised by selling days available in the week.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [call_week, territory_id]

  - name: fct_territory_performance
    description: >
      Territory commercial performance by week. Volume, gross-to-net, goal
      attainment, and the field activity behind it.

      This model draws on two independent source systems for a single reported
      number. Gross sales come from SAP; the discount applied to them comes from
      MMIT. When either feed is late, net sales and goal attainment are affected,
      which is why the data health signal on this model matters more than on
      most.
    columns:
      - name: sales_week
        description: Week-starting date.
        tests: [not_null]
      - name: territory_id
        tests: [not_null]
      - name: region_name
        description: Region the territory rolls up to.
      - name: trx_actual
        description: Total prescriptions in the week. Null after the last financial close.
      - name: nbrx_actual
        description: New-to-brand prescriptions in the week. Null after the last close.
      - name: gross_sales
        description: Gross sales in USD from SAP, before any payer discount.
      - name: blended_discount_rate
        description: >
          Volume-weighted payer discount for the week, sourced from MMIT — not
          from the finance system. This is the input most people assume comes
          from SAP and does not.
      - name: revenue_deduction
        description: Gross sales multiplied by the blended discount rate.
      - name: net_sales
        description: >
          Reported net sales. Gross sales less the revenue deduction. Recomputed
          here from first principles rather than taken from SAP so that the
          discount assumption behind it is visible and auditable.
      - name: net_sales_goal
        description: Territory net sales goal for the week.
      - name: goal_attainment_pct
        description: >
          Net sales divided by net sales goal. The headline number on the
          executive review. Note that it inherits the freshness of both the SAP
          and MMIT feeds.
      - name: reach_pct
        description: Share of the target HCP list reached in the week.
      - name: net_sales_sap
        description: >
          SAP's own net sales figure. Not reported anywhere — retained solely so
          the recomputed value can be reconciled against it.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [sales_week, territory_id]

  - name: fct_brand_share
    description: >
      Monthly competitive position by drug and indication, from syndicated data.

      The only upstream source is IQVIA Exponent, which publishes monthly with a
      lag. Anything built on this model inherits that staleness, so it should be
      read as a trend indicator rather than a current-state measure.
    columns:
      - name: share_month_end
        description: Month-end date the figures apply to.
        tests: [not_null]
      - name: drug_name
        description: The brand or one of its three tracked competitors.
        tests: [not_null]
      - name: indication
        description: Therapeutic area.
        tests:
          - accepted_values:
              values: ['Derm', 'Rheum']
      - name: trx_volume
        description: Total prescriptions for the drug and indication in the month.
      - name: trx_share
        description: Share of total market TRx for the indication. Sums to 1.0 per month.
      - name: market_trx_total
        description: Total market TRx for the indication in the month, across all drugs.
      - name: share_rank
        description: Rank by volume within the indication and month. 1 is market leader.
      - name: share_change_mom
        description: Change in TRx share versus the prior month, in share points.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [share_month_end, drug_name, indication]
