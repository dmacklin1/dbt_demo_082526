version: 2

models:
  - name: stg_veeva__calls
    description: >
      One row per planned call, cleaned and typed. A null call_id means the call
      was planned but not completed, so completed_call_flag is derived here to
      make that explicit for every downstream consumer.
    columns:
      - name: call_id
        description: Identifier for a completed call. Null when the call did not happen.
      - name: call_week
        description: Week-starting date the call was planned for.
        tests: [not_null]
      - name: hcp_id
        description: HCP the call was directed at.
        tests:
          - not_null
          - relationships:
              to: ref('stg_veeva__hcp')
              field: hcp_id
      - name: rep_id
        description: Rep who owned the call.
        tests: [not_null]
      - name: territory_id
        description: Territory the call rolls up to.
        tests:
          - not_null
          - relationships:
              to: ref('stg_internal__geography')
              field: territory_id
      - name: indication
        description: Therapeutic area the call was detailed against.
        tests:
          - accepted_values:
              values: ['Derm', 'Rheum']
      - name: call_type
        description: Whether the interaction was in person or virtual.
        tests:
          - accepted_values:
              values: ['In-Person', 'Virtual']
      - name: planned_call_flag
        description: Always 1. One row equals one planned call.
      - name: completed_call_flag
        description: 1 when the call was completed, 0 when it was planned only.
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: loaded_at
        description: Timestamp the source row landed in bronze.
