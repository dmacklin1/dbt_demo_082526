profile: 'default'          # <-- Partner Connect usually names this 'default'. Confirm in your environment.

model-paths: ["models"]
macro-paths: ["macros"]
test-paths:  ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# =====================================================================
# CONFIRM THESE MATCH THE DATABASES AND SCHEMAS YOU CREATED.
