# =====================================================================
models:
  acme_field_force:

    SLV:
      +materialized: view
      +database: DBT_DEMO_SLV
      FCT:
        +schema: FCT
      DIM:
        +schema: DIM

    GLD:
      +materialized: table
      +database: DBT_DEMO_GLD
      +schema: OUTPUT
